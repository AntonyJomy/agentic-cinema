# Cloud Build: build + deploy backend and frontend to Cloud Run.
#
# One-time setup:  .\scripts\setup-gcp.ps1
# Every deploy:    .\scripts\deploy.ps1
#
# Project / Firebase config is NOT stored here — pass via .\scripts\deploy.ps1
# (reads local .env). API key comes from Secret Manager (FIREBASE_WEB_API_KEY).

timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

# Only generic defaults. Project IDs + Firebase web config come from deploy.ps1.
substitutions:
  _REGION: australia-southeast1
  _ARTIFACT_REPO: agentic-cinema
  _BACKEND_SERVICE: agentic-cinema-api
  _FRONTEND_SERVICE: agentic-cinema-web
  _GCS_BUCKET: ""
  _FIRESTORE_PROJECT: ""
  _FIRESTORE_DATABASE: ""
  _FIREBASE_PROJECT_ID: ""
  _VITE_FIREBASE_AUTH_DOMAIN: ""
  _VITE_FIREBASE_PROJECT_ID: ""
  _VITE_FIREBASE_APP_ID: ""
  _VITE_FIREBASE_STORAGE_BUCKET: ""
  _VITE_FIREBASE_MESSAGING_SENDER_ID: ""

# Injected at build time — never commit API keys to this file.
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_WEB_API_KEY/versions/latest
      env: VITE_FIREBASE_API_KEY

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/api:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/api:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/web:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/web:latest

steps:
  # -------------------------------------------------------------------------
  # 1) Backend image
  # -------------------------------------------------------------------------
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/api:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/api:latest
      - -f
      - Dockerfile
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    waitFor: [build-api]
    entrypoint: bash
    args:
      - -c
      - |
        docker push "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/api:$BUILD_ID"
        docker push "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/api:latest"

  # -------------------------------------------------------------------------
  # 2) Deploy backend (CORS updated after frontend URL is known)
  # -------------------------------------------------------------------------
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: [push-api]
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/api:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=2Gi
      - --cpu=2
      - --timeout=3600
      - --concurrency=20
      - --min-instances=0
      - --max-instances=5
      # CORS_ORIGINS is a temporary placeholder; update-cors step sets the real frontend URL.
      - --set-env-vars=ENVIRONMENT=production,AUTH_MODE=firebase,CLEARANCE_STORE=firestore,FIRESTORE_PROJECT=${_FIRESTORE_PROJECT},FIRESTORE_DATABASE=${_FIRESTORE_DATABASE},FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},GCS_BUCKET_NAME=${_GCS_BUCKET},PIPELINE_CONCURRENCY=1,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GCLOUD_PROJECT=$PROJECT_ID,CORS_ORIGINS=http://localhost:5173
      - --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,GOOGLE_API_KEY=GEMINI_API_KEY:latest,PARALLEL_API_KEY=PARALLEL_API_KEY:latest
      - --quiet

  - id: backend-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    waitFor: [deploy-api]
    args:
      - -c
      - |
        set -euo pipefail
        URL="$(gcloud run services describe "${_BACKEND_SERVICE}" \
          --region="${_REGION}" \
          --format='value(status.url)')"
        echo "Backend URL: $${URL}"
        echo "$${URL}" > /workspace/backend_url.txt

  # -------------------------------------------------------------------------
  # 3) Frontend image (baked with live backend URL)
  # -------------------------------------------------------------------------
  - id: build-web
    name: gcr.io/cloud-builders/docker
    waitFor: [backend-url]
    entrypoint: bash
    secretEnv: [VITE_FIREBASE_API_KEY]
    args:
      - -c
      - |
        set -euo pipefail
        API_URL="$(cat /workspace/backend_url.txt)"
        docker build \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/web:$BUILD_ID" \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/web:latest" \
          -f frontend/Dockerfile \
          --build-arg "VITE_API_URL=$${API_URL}" \
          --build-arg "VITE_FIREBASE_API_KEY=$${VITE_FIREBASE_API_KEY}" \
          --build-arg "VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}" \
          --build-arg "VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}" \
          --build-arg "VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}" \
          --build-arg "VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET}" \
          --build-arg "VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID}" \
          frontend

  - id: push-web
    name: gcr.io/cloud-builders/docker
    waitFor: [build-web]
    entrypoint: bash
    args:
      - -c
      - |
        docker push "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/web:$BUILD_ID"
        docker push "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/web:latest"

  # -------------------------------------------------------------------------
  # 4) Deploy frontend
  # -------------------------------------------------------------------------
  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: [push-web]
    args:
      - run
      - deploy
      - ${_FRONTEND_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/web:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --cpu=1
      - --timeout=60
      - --concurrency=80
      - --min-instances=0
      - --max-instances=10
      - --quiet

  - id: frontend-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    waitFor: [deploy-web]
    args:
      - -c
      - |
        set -euo pipefail
        URL="$(gcloud run services describe "${_FRONTEND_SERVICE}" \
          --region="${_REGION}" \
          --format='value(status.url)')"
        echo "Frontend URL: $${URL}"
        echo "$${URL}" > /workspace/frontend_url.txt

  # -------------------------------------------------------------------------
  # 5) Wire CORS on backend to the Cloud Run frontend origin
  # -------------------------------------------------------------------------
  - id: update-cors
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    waitFor: [frontend-url]
    args:
      - -c
      - |
        set -euo pipefail
        FE_URL="$(cat /workspace/frontend_url.txt)"
        BE_URL="$(cat /workspace/backend_url.txt)"

        # ^|^ uses | as the pair delimiter so commas inside CORS_ORIGINS are safe.
        # --update-env-vars merges; it does not wipe existing vars/secrets.
        gcloud run services update "${_BACKEND_SERVICE}" \
          --region="${_REGION}" \
          --update-env-vars="^|^CORS_ORIGINS=$${FE_URL},http://localhost:5173,http://127.0.0.1:5173" \
          --quiet

        # Ensure public invoke (org policies sometimes block --allow-unauthenticated)
        gcloud run services add-iam-policy-binding "${_FRONTEND_SERVICE}" \
          --region="${_REGION}" \
          --member="allUsers" \
          --role="roles/run.invoker" \
          --quiet || true
        gcloud run services add-iam-policy-binding "${_BACKEND_SERVICE}" \
          --region="${_REGION}" \
          --member="allUsers" \
          --role="roles/run.invoker" \
          --quiet || true

        echo ""
        echo "============================================"
        echo " Deploy complete"
        echo " Frontend: $${FE_URL}"
        echo " Backend:  $${BE_URL}"
        echo "============================================"
        echo "Add the frontend hostname to Firebase Auth"
        echo "Authorized domains (Console > Authentication)."
        echo "============================================"
